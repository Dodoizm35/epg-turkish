name: Update EPG

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run update script
        run: |
          chmod +x ./custom/update.sh
          ./custom/update.sh

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add custom/tr.channels.xml custom/public/guide.xml custom/public/guide.xml.gz
          git commit -m "Update EPG data [skip ci]" || echo "No changes to commit"
          git push origin master
